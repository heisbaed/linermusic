pluginManagement {
    repositories {
        if (file('../.maven-offline').exists()) maven { url = uri('../.maven-offline') }
        google(); mavenCentral(); gradlePluginPortal()
    }
    resolutionStrategy { eachPlugin { if (requested.id.id == 'com.android.application') useModule('com.android.tools.build:gradle:' + requested.version) } }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (file('../.maven-offline').exists()) maven { url = uri('../.maven-offline') }
        google(); mavenCentral()
    }
}
rootProject.name = 'CineMusic'
include ':app'
